# Configurare extracție LLM (llm_input.json -> minutes.json). Rulează doar pe Ollama local.
# Orice cheie poate fi suprascrisă din variabile de mediu, vezi LLM/README.md.

ollama:
  url: http://localhost:11434   # doar localhost / 127.0.0.1 / ::1 sunt acceptate
  model: qwen3:8b
  timeout_s: 300                # per apel
  retries: 1                    # reîncercări după primul eșec
  keep_alive: 5m                # cât rămâne modelul în VRAM după ultimul apel
  num_ctx: 8192
  temperature: 0.15
  repeat_penalty: 1.1           # contra buclelor (același caz repetat până la num_predict)
  seed: 42

# setări per etapă; think: true doar de testat (mult mai lent)
stages:
  # o fereastră / ședință scurtă. Dacă răspunsul e tăiat, reîncercarea folosește până la max_predict,
  # cât încape în num_ctx lângă promptul real (fără să mărească num_ctx => modelul rămâne tot în VRAM)
  # 4096: cu `facts` (analize, doze, proceduri) răspunsul pentru 6–8 pacienți trece de 2048 de tokeni
  extract:   {think: false, num_predict: 4096, max_predict: 6144}
  segment:   {think: false, num_predict: 2048}   # împărțirea ședinței pe pacienți (vezi `segment`)
  complete:  {think: false, num_predict: 2048}   # a doua trecere pe fragmentul unui pacient (vezi `complete`)
  same_case: {think: false, num_predict: 32}     # „același caz?” pentru chei ambigue
  supersede: {think: false, num_predict: 128}    # ce decizii au fost înlocuite (caz cu >= 2 decizii)
  translate: {think: false, num_predict: 1024}   # rusa rămasă în câmpurile care trebuie să fie în română
  final:     {think: false, num_predict: 1024}   # meeting_summary + ordinea cazurilor

context:
  token_factor: 1.55            # tokeni Qwen ≈ tokens_est × factor; măsurat pe qwen3:8b: ~1.56 pe ferestrele
                                # de transcriere (prefixele [mm:ss] UNK: și cifrele costă), ~1.4 pe prompt.
                                # Verifică run.json: token_factor_observed
  header_reserve_tokens: 600    # loc estimat pentru antet (cazuri cunoscute + rezumat) la verificarea inițială
  on_overflow: expand           # expand: mărește num_ctx până la max_num_ctx; skip: sare fereastra (raportat)
  max_num_ctx: 16384            # ~2.3 GB KV cache pentru qwen3:8b; cu modelul Q4 ~7.5 GB VRAM (încape în 12 GB;
                                # pe o placă de 8 GB coborâți la 12288 și num_predict la 3072)
  header_max_cases: 40          # câte cazuri cunoscute intră în antet (cele mai recente)
  header_summaries: 1           # câte rezumate de ferestre anterioare intră în antet

input:
  uncertain_ratio: 0.5          # low_confidence_ratio peste prag => linie nesigură (pe lângă low_confidence / [?])

quotes:
  min_score: 80                 # rapidfuzz partial_ratio minim pentru potrivirea citat -> replică
  min_score_same_ts: 65         # prag mai mic când și timestamp-ul se potrivește
  short_quote_chars: 12         # citatele mai scurte cer timestamp identic și scor >= 90

merge:
  same_score: 90                # chei de caz cu scor >= => același caz
  diff_score: 60                # scor <= => cazuri diferite; între praguri => întrebăm LLM-ul
  supersede: llm                # llm: un apel scurt per caz cu >= 2 decizii (la eșec: ca flag)
                                # flag: doar deciziile marcate de model ca „schimbă decizia anterioară”
                                # all: orice decizie anterioară a cazului devine superseded

# Modul pe pacienți: un apel scurt împarte ședința pe pacienți, apoi fiecare pacient e extras separat.
# Motiv: extras dintr-o fereastră mare, qwen3:8b amesteca pacienții și îi omitea pe cei de la final
# (Medpark: 2 pacienți în loc de 4+). Dacă transcrierea nu încape într-un apel sau apelul eșuează,
# se folosesc ferestrele ASR (llm_input.json), ca înainte.
segment:
  enabled: true
  max_segment_tokens: 1200      # un pacient mai lung se împarte în bucăți cu aceeași etichetă
  context_turns: 2              # replici dinaintea fragmentului, doar pentru context
  min_patient_s: 15             # începuturi mai apropiate de atât = același pacient (nu un fragment nou)
  window_tokens: 3000           # transcriere mai lungă (ședințe de ~15+ min): împărțirea se face pe bucăți consecutive,
                                # fiecare știind ce pacient continuă; începuturile vecine cu același pat/număr se unesc

extract:
  max_cases: 12                # limită în schema JSON (maxItems) per fereastră, contra buclelor
  max_decisions: 8              # per caz
  max_facts: 20                 # constatări clinice per caz (analize, tratament, proceduri, evoluție)

complete:
  enabled: true                 # modul pe pacienți: încă un apel per fragment, doar pentru constatările ratate
                                # (replicile lungi și dense); vezi AI/evaluation/RESULTS.md
